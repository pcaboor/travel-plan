services:
  postgres:
    image: postgres:16-alpine
    container_name: travel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-travel_plan}
      POSTGRES_USER: ${POSTGRES_USER:-travel_plan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - travel-internal
      - travel-edge

  neo4j:
    image: neo4j:5-community
    container_name: travel-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-change_me_neo4j}
      NEO_HC_USER: ${NEO4J_USER:-neo4j}
      NEO_HC_PASSWORD: ${NEO4J_PASSWORD:-change_me_neo4j}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u $${NEO_HC_USER} -p $${NEO_HC_PASSWORD} 'RETURN 1;'"]
      interval: 15s
      timeout: 10s
      retries: 10
    networks:
      - travel-internal
      - travel-edge

  auth-service:
    build:
      context: ../..
      dockerfile: services/auth-service/Dockerfile
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      AUTH_DATABASE_URL: ${AUTH_DATABASE_URL:-jdbc:postgresql://postgres:5432/travel_plan}
      AUTH_DATABASE_USERNAME: ${AUTH_DATABASE_USERNAME:-travel_plan}
      AUTH_DATABASE_PASSWORD: ${AUTH_DATABASE_PASSWORD:-change_me_postgres}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me-please-32bytes-minimum-xx}
      JWT_ISSUER: ${JWT_ISSUER:-travelplan-auth}
      JWT_ACCESS_TTL_MINUTES: ${JWT_ACCESS_TTL_MINUTES:-60}
      ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL:-admin@travelplan.local}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-ChangeMe123!}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://localhost:5443,http://localhost:5173}
    depends_on:
      postgres:
        condition: service_healthy
      admin-service:
        condition: service_started
    deploy:
      replicas: 2
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8081/actuator/health > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - travel-internal

  admin-service:
    build:
      context: ../..
      dockerfile: services/admin-service/Dockerfile
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      ADMIN_DATABASE_URL: ${ADMIN_DATABASE_URL:-jdbc:postgresql://postgres:5432/travel_plan}
      ADMIN_DATABASE_USERNAME: ${ADMIN_DATABASE_USERNAME:-travel_plan}
      ADMIN_DATABASE_PASSWORD: ${ADMIN_DATABASE_PASSWORD:-change_me_postgres}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me-please-32bytes-minimum-xx}
      JWT_ISSUER: ${JWT_ISSUER:-travelplan-auth}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://localhost:5443,http://localhost:5173}
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      replicas: 2
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8082/actuator/health > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - travel-internal

  travel-service:
    build:
      context: ../..
      dockerfile: services/travel-service/Dockerfile
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      NEO4J_URI: ${TRAVEL_NEO4J_URI:-bolt://neo4j:7687}
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-change_me_neo4j}
      NEO4J_DATABASE: ${TRAVEL_NEO4J_DATABASE:-neo4j}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me-please-32bytes-minimum-xx}
      JWT_ISSUER: ${JWT_ISSUER:-travelplan-auth}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://localhost:5443,http://localhost:5173}
    depends_on:
      neo4j:
        condition: service_healthy
    deploy:
      replicas: 2
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8083/actuator/health > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - travel-internal

  payment-service:
    build:
      context: ../..
      dockerfile: services/payment-service/Dockerfile
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      PAYMENT_DATABASE_URL: ${PAYMENT_DATABASE_URL:-jdbc:postgresql://postgres:5432/travel_plan}
      PAYMENT_DATABASE_USERNAME: ${PAYMENT_DATABASE_USERNAME:-travel_plan}
      PAYMENT_DATABASE_PASSWORD: ${PAYMENT_DATABASE_PASSWORD:-change_me_postgres}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me-please-32bytes-minimum-xx}
      JWT_ISSUER: ${JWT_ISSUER:-travelplan-auth}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,https://localhost:5443}
      STRIPE_ENABLED: ${STRIPE_ENABLED:-false}
      STRIPE_API_KEY: ${STRIPE_API_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      PAYPAL_ENABLED: ${PAYPAL_ENABLED:-false}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-}
      PAYPAL_API_BASE: ${PAYPAL_API_BASE:-https://api-m.sandbox.paypal.com}
      PAYPAL_WEBHOOK_ID: ${PAYPAL_WEBHOOK_ID:-}
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      replicas: 2
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8084/actuator/health > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - travel-internal
      - travel-edge

  sonarqube-db:
    image: postgres:16-alpine
    container_name: travel-sonarqube-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${SONARQUBE_JDBC_DATABASE:-sonarqube}
      POSTGRES_USER: ${SONARQUBE_JDBC_USERNAME:-sonar}
      POSTGRES_PASSWORD: ${SONARQUBE_JDBC_PASSWORD:-change_me_sonar}
    volumes:
      - sonarqube_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - travel-ci

  sonarqube:
    image: sonarqube:10-community
    container_name: travel-sonarqube
    restart: unless-stopped
    depends_on:
      sonarqube-db:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonarqube-db:5432/${SONARQUBE_JDBC_DATABASE:-sonarqube}
      SONAR_JDBC_USERNAME: ${SONARQUBE_JDBC_USERNAME:-sonar}
      SONAR_JDBC_PASSWORD: ${SONARQUBE_JDBC_PASSWORD:-change_me_sonar}
    ports:
      - "9000:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:9000/api/system/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
    networks:
      - travel-ci

  jenkins:
    build:
      context: ../..
      dockerfile: infra/jenkins/Dockerfile
    container_name: travel-jenkins
    restart: unless-stopped
    user: root
    environment:
      JENKINS_ADMIN_ID: ${JENKINS_ADMIN_ID:-admin}
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD:-change_me_jenkins}
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - ../../:/workspace/travel-plan
    depends_on:
      sonarqube:
        condition: service_started
    networks:
      - travel-ci
      - travel-internal

  admin-dashboard:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    container_name: travel-admin-dashboard
    restart: unless-stopped
    ports:
      - "5173:80"
      - "5443:443"
    depends_on:
      auth-service:
        condition: service_healthy
      admin-service:
        condition: service_healthy
      travel-service:
        condition: service_healthy
    networks:
      - travel-edge
      - travel-internal
    healthcheck:
      test: ["CMD-SHELL", "wget -q --no-check-certificate -O /dev/null https://localhost/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

networks:
  travel-internal:
    driver: bridge
    internal: true
  travel-ci:
    driver: bridge
  travel-edge:
    driver: bridge

volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:
  sonarqube_db_data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  jenkins_home:
