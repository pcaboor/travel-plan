name: CI

# Runs the full Maven test suite on every pull request (and on pushes to the
# integration branches) so no change lands without its unit + integration
# tests going green. The Jenkins pipeline still owns the heavier SonarQube
# analysis and Docker image build.
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The default GITHUB_TOKEN is read-only; the test reporter needs to create a
# check run and annotate the PR, so grant those scopes explicitly.
permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    env:
      # Ubuntu runners ship with Docker, so Testcontainers works out of the box.
      # Disabling Ryuk matches the project's known-good Jenkins configuration.
      TESTCONTAINERS_RYUK_DISABLED: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and run tests
        run: mvn -B clean verify

      - name: Publish test report
        if: always()
        continue-on-error: true
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: "**/target/surefire-reports/*.xml"
          check_name: Unit & integration tests

      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: "**/target/surefire-reports/*.xml"
          if-no-files-found: ignore

  frontend:
    name: Frontend unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check & build
        run: npm run build

      - name: Vitest
        run: npm run test:run
