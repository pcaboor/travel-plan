name: E2E

# Boots the application stack (gateway + auth/admin/travel services + their
# datastores) and runs the Playwright journey against it. Heavier than the unit
# gate, so it runs on PRs to the integration branches and on demand. Only the
# app services are started — observability, Jenkins and SonarQube are skipped —
# and heaps are capped via docker-compose.e2e.yml to fit the runner.
on:
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: Playwright (full stack)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start the application stack
        run: |
          docker compose \
            -f infra/docker/docker-compose.yml \
            -f infra/docker/docker-compose.e2e.yml \
            --env-file .env.example \
            up -d --build admin-dashboard

      - name: Wait for the gateway to be healthy
        run: |
          for i in $(seq 1 60); do
            if curl -fsk https://localhost:5443/ >/dev/null 2>&1; then
              echo "gateway is up"; exit 0
            fi
            echo "waiting for the gateway ($i/60)…"; sleep 10
          done
          echo "gateway did not become healthy in time"
          docker compose -f infra/docker/docker-compose.yml -f infra/docker/docker-compose.e2e.yml ps
          exit 1

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps & Chromium
        working-directory: frontend
        run: |
          npm ci
          npm run e2e:install

      - name: Run Playwright
        working-directory: frontend
        env:
          E2E_BASE_URL: https://localhost:5443
        run: npm run e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          if-no-files-found: ignore

      - name: Dump stack logs on failure
        if: failure()
        run: |
          docker compose \
            -f infra/docker/docker-compose.yml \
            -f infra/docker/docker-compose.e2e.yml \
            logs --no-color --tail=200

      - name: Tear down
        if: always()
        run: |
          docker compose \
            -f infra/docker/docker-compose.yml \
            -f infra/docker/docker-compose.e2e.yml \
            down -v
