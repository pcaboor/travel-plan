spring:
  application:
    name: travel-service
  cloud:
    vault:
      enabled: false
      token: vault-disabled-placeholder
  neo4j:
    uri: ${NEO4J_URI:bolt://neo4j:7687}
    authentication:
      username: ${NEO4J_USER:neo4j}
      password: ${NEO4J_PASSWORD:change_me_neo4j}
  data:
    neo4j:
      database: ${NEO4J_DATABASE:neo4j}
  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://elasticsearch:9200}

travelplan:
  jwt:
    secret: ${JWT_SECRET:dev-secret-change-me-please-32bytes-minimum-xx}
    issuer: ${JWT_ISSUER:travelplan-auth}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

server:
  port: 8083

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] [%X{correlationId:-no-correlation-id}] %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
