spring:
  application:
    name: payment-service
  cloud:
    vault:
      enabled: false
      token: vault-disabled-placeholder
  datasource:
    url: ${PAYMENT_DATABASE_URL:jdbc:h2:mem:payment_service;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE}
    username: ${PAYMENT_DATABASE_USERNAME:sa}
    password: ${PAYMENT_DATABASE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: payment
  flyway:
    enabled: true
    schemas: payment
    locations: classpath:db/migration
    baseline-on-migrate: true
    create-schemas: true

server:
  port: 8084

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] [%X{correlationId:-no-correlation-id}] %logger{36} - %msg%n"

travelplan:
  jwt:
    secret: ${JWT_SECRET:dev-secret-change-me-please-32bytes-minimum-xx}
    issuer: ${JWT_ISSUER:travelplan-auth}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://localhost:5443}

payment:
  providers:
    stripe:
      enabled: ${STRIPE_ENABLED:false}
      api-key: ${STRIPE_API_KEY:}
      webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
    paypal:
      enabled: ${PAYPAL_ENABLED:false}
      client-id: ${PAYPAL_CLIENT_ID:}
      client-secret: ${PAYPAL_CLIENT_SECRET:}
      api-base: ${PAYPAL_API_BASE:https://api-m.sandbox.paypal.com}
      webhook-id: ${PAYPAL_WEBHOOK_ID:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
