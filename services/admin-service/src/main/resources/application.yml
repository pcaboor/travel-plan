spring:
  application:
    name: admin-service
  datasource:
    url: ${ADMIN_DATABASE_URL:jdbc:h2:mem:admin_service;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE}
    username: ${ADMIN_DATABASE_USERNAME:sa}
    password: ${ADMIN_DATABASE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

travelplan:
  jwt:
    secret: ${JWT_SECRET:dev-secret-change-me-please-32bytes-minimum-xx}
    issuer: ${JWT_ISSUER:travelplan-auth}

server:
  port: 8082

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] [%X{correlationId:-no-correlation-id}] %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
