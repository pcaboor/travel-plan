sonar.projectKey=travel-plan
sonar.projectName=Travel Management System
sonar.projectVersion=0.1.0

sonar.sources=services
sonar.tests=services
sonar.test.inclusions=**/src/test/**
sonar.exclusions=**/target/**,**/Dockerfile

sonar.java.binaries=**/target/classes
sonar.sourceEncoding=UTF-8

# JaCoCo coverage reports (generated by the jacoco-maven-plugin `report` goal)
sonar.coverage.jacoco.xmlReportPaths=**/target/site/jacoco/jacoco.xml

# Infrastructure / data holders not unit-tested in the pipeline
# (config beans, Spring Boot mains, HTTP clients, the ES adapter, DTOs, entities).
sonar.coverage.exclusions=**/config/**,**/*Application.java,**/*Client.java,**/search/ElasticsearchTravelSearch.java,**/api/dto/**,**/domain/**,**/filter/**
